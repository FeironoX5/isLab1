<div style="margin-bottom: 16px; display: flex; gap: 8px; align-items: center;">
  <input type="file" accept=".json" (change)="importFile($event)">
  <button mat-stroked-button (click)="loadHistory()">Обновить историю импорта</button>
  <span>{{ importMessage() }}</span>
</div>

<table mat-table [dataSource]="history()" class="mat-elevation-z2" style="width: 100%; margin-bottom: 16px;">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let row">{{ row.id }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">{{ row.status }}</td>
  </ng-container>
    <ng-container matColumnDef="addedCount">
    <th mat-header-cell *matHeaderCellDef>Added</th>
    <td mat-cell *matCellDef="let row">{{ row.status === 'SUCCESS' ? row.addedCount : '-' }}</td>
  </ng-container>
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Created</th>
    <td mat-cell *matCellDef="let row">{{ row.createdAt }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-grid-list cols="2" rowHeight="2:1" gutterSize="10">
  @for (operation of operations; track $index) {
    @if ($index > 0) {
      <mat-grid-tile (click)="openDialog($index)">
        <mat-card matRipple appearance="outlined">
          <mat-card-header>
            <mat-card-title>{{ operation.title }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p>
              {{ operation.description }}
            </p>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    }
  }
</mat-grid-list>
